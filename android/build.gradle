buildscript {
    // Repositories are managed in settings.gradle (dependencyResolutionManagement).
    // Keep this block for any classpath dependencies if needed.
}

allprojects {
    // Repositories are managed in settings.gradle — do not add google() or mavenCentral() here.
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
